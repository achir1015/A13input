name: 打包 Android APK
on:
  push:
    branches: [main]
    paths: ['index.html', 'www/**', 'android/**', 'capacitor.config.json', 'package.json']
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - run: npm ci
      - run: cp index.html www/index.html && npx cap sync android
      - run: chmod +x android/gradlew && cd android && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: A13-android-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
