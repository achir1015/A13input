<style>
  /* ====== 基本版面：模仿原系統的綠色底、左側病人清單、右側多頁輸入 ====== */
  :root{
    --green-bg:#dff0d8;
    --green-bg2:#eaf6e6;
    --pink:#f6a6b2;
    --pink-dark:#e8899a;
    --blue:#4a90d9;
    --border:#bcd6b8;
    --grey-text:#666;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; font-family:"Microsoft JhengHei","PingFang TC",Arial,sans-serif;
    font-size:21px; color:#222; background:#f2f2f2;
  }
  .app{ display:flex; flex-direction:column; height:100vh; height:100dvh; }
  /* 手機 App／瀏覽器的安全區域：避開 iPhone 瀏海、Android 狀態列與底部手勢條；
     overscroll-behavior 關掉下拉重新整理，避免編輯到一半整頁被刷新 */
  html, body{ overscroll-behavior:none; -webkit-tap-highlight-color:transparent; }
  .app{ padding-bottom:env(safe-area-inset-bottom); }

  /* 登入畫面 */
  .login-overlay{
    position:fixed; inset:0; background:linear-gradient(135deg,#2f6f8f,#1c4a63);
    display:flex; align-items:center; justify-content:center; z-index:200; padding:16px;
  }
  .login-box{
    background:#fff; padding:32px 28px; border-radius:10px; width:420px; max-width:100%;
    box-shadow:0 10px 30px rgba(0,0,0,.3); display:flex; flex-direction:column; gap:12px;
  }
  .login-box h2{ margin:0 0 2px; color:#2f6f8f; text-align:center; }
  .login-sub{ margin:0 0 8px; color:#777; text-align:center; font-size:18px; }
  .login-box input{
    padding:12px 14px; border:1px solid #bbb; border-radius:5px; font-size:40px;
  }
  .login-box button{
    padding:10px; border:none; border-radius:5px; background:var(--blue); color:#fff;
    font-size:21px; cursor:pointer;
  }
  .login-box button:hover{ background:#3a7fc0; }
  .login-error{ color:#e05a5a; font-size:18px; min-height:1.2em; text-align:center; }

  /* ====== 通用彈出視窗（目前給「病床資料管理」用） ====== */
  .modal-overlay{
    display:none; position:fixed; inset:0; background:rgba(0,0,0,.5);
    z-index:210; align-items:center; justify-content:center; padding:16px;
  }
  .modal-overlay.show{ display:flex; }
  .modal-box{
    background:#fff; border-radius:8px; width:720px; max-width:100%;
    max-height:88vh; display:flex; flex-direction:column; overflow:hidden;
    box-shadow:0 10px 30px rgba(0,0,0,.35);
  }
  .modal-header{
    background:#2f6f8f; color:#fff; padding:12px 16px; font-size:22px; font-weight:bold;
    display:flex; justify-content:space-between; align-items:center;
  }
  .modal-close{
    background:none; border:1px solid rgba(255,255,255,.6); color:#fff;
    border-radius:4px; padding:2px 10px; font-size:18px; cursor:pointer;
  }
  .modal-body{ padding:16px; overflow-y:auto; }

  table.bedcrud-table{ max-width:none; width:100%; }
  table.bedcrud-table td, table.bedcrud-table th{ font-size:16px; padding:6px 8px; }
  .bedcrud-table .cardno{ font-size:1.4em; }
  .bedcrud-edit-btn, .bedcrud-del-btn{
    padding:4px 10px; margin:0 3px; border-radius:4px; cursor:pointer; border:1px solid #999;
  }
  .bedcrud-del-btn{ background:#e05a5a; color:#fff; border-color:#e05a5a; }

  .bed-crud-form{ display:flex; flex-direction:column; gap:10px; }
  .bf-row{ display:flex; align-items:center; gap:10px; }
  .bf-row label{ width:80px; flex:0 0 auto; font-weight:bold; color:#2b5d2b; }
  .bf-row input, .bf-row select{
    flex:1; padding:8px; border:1px solid #999; border-radius:4px; font-size:18px;
  }
  .bf-warn{ color:#cc7a00; font-size:16px; min-height:1.2em; }
  .bf-actions{ display:flex; gap:10px; margin-top:6px; }
  .bf-actions button{ padding:8px 18px; font-size:18px; border-radius:4px; cursor:pointer; }
  .bf-actions button.primary{ background:var(--blue); color:#fff; border:1px solid var(--blue); }
  .bf-actions button:not(.primary){ background:#fff; border:1px solid #999; }

  /* 上方標題列 */
  .titlebar{
    background:#2f6f8f; color:#fff; padding:calc(6px + env(safe-area-inset-top)) calc(12px + env(safe-area-inset-right)) 6px calc(12px + env(safe-area-inset-left));
    display:flex; justify-content:space-between; align-items:center; font-size:20px; gap:8px;
  }
  /* 標題文字＋登入信箱這兩個欄位，一定要限制成單行＋超出省略號（...），
     不然遇到像 email 這種沒有空格、不能斷行的長字串時，
     某些手機瀏覽器（如 Android Chrome）的 flexbox 演算法會把旁邊可斷行的中文標題
     硬擠成一個字一行的窄直條，整個標題列會被撐得非常高，
     連帶把下面병人清單/分頁內容全部往下擠到看不見。iPhone Safari 剛好沒踩到這個問題，
     不代表沒有 bug，只是版面剛好還夠寬。 */
  .titlebar > div{
    min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
  }
  .titlebar > div:first-of-type{ flex:1 1 auto; }
  .titlebar .ver{ opacity:.8; flex:0 1 auto; max-width:45%; }
  .menu-btn{
    display:none; /* 桌機不需要漢堡選單，手機版才會透過 media query 顯示 */
    background:none; border:1px solid rgba(255,255,255,.6); color:#fff;
    font-size:27px; line-height:1; padding:4px 10px; border-radius:4px; cursor:pointer;
  }
  .sidebar-overlay{
    display:none; position:fixed; inset:0; background:rgba(0,0,0,.45); z-index:40;
  }
  .sidebar-overlay.show{ display:block; }

  /* 工具列（存檔／取消／匯出／匯入…） */
  .toolbar{
    background:#f7f7f7; border-bottom:1px solid #ccc; padding:6px 10px;
    display:flex; gap:8px; flex-wrap:wrap; align-items:center;
  }
  .toolbar button{
    padding:7px 14px; border:1px solid #99b; border-radius:4px; background:#fff;
    cursor:pointer; font-size:15px;
  }
  .toolbar button.primary{ background:var(--blue); color:#fff; border-color:var(--blue); }
  .toolbar button.danger{ background:#e05a5a; color:#fff; border-color:#e05a5a; }
  .toolbar .sep{ width:1px; background:#ccc; align-self:stretch; margin:0 4px;}

  /* 病人資訊列 */
  .patientbar-wrap{
    display:flex; align-items:flex-start; background:#fff; border-bottom:1px solid #ccc;
  }
  .toggle-patientbar-btn{
    flex:0 0 auto; margin:6px 4px 6px 8px; padding:4px 10px; font-size:16px;
    border:1px solid #999; border-radius:4px; background:#fff; cursor:pointer;
  }
  .toggle-patientbar-btn:hover{ background:#f0f0f0; }
  .patientbar{
    flex:1; min-width:0; padding:6px 12px 6px 0;
    display:flex; flex-wrap:wrap; gap:14px; font-size:20px; color:#333;
  }
  .patientbar.collapsed{ display:none; }
  .pb-summary{ display:none; flex:1; min-width:0; padding:6px 8px; font-size:18px; line-height:1.3; }
  .patientbar.collapsed + .pb-summary{ display:block; }
  .pb-summary .pb-dx{ color:#666; font-size:15px; }
  .mobile-top{ display:none; }
  .patientbar b{ color:#000; }

  .body-wrap{ flex:1; display:flex; overflow:hidden; min-height:0; }

  /* 左側：病人清單 */
  .sidebar{
    width:320px; min-width:260px; background:#fff; border-right:1px solid #ccc;
    display:flex; flex-direction:column;
  }
  .shifttabs{ display:flex; gap:4px; padding:6px; background:#2f6f8f; }
  .shifttabs button{
    flex:1; padding:8px 4px; border:none; border-radius:4px; background:#5c93ac; color:#fff;
    font-size:20px; cursor:pointer;
  }
  .shifttabs button.active{ background:var(--pink); font-weight:bold; }
  /* 三個班別各自固定的文字顏色，不管有沒有被選中都維持這個顏色，方便一眼辨識 */
  .shifttabs button[data-shift="白班"]{ color:#b8860b; }
  .shifttabs button[data-shift="小夜"]{ color:#1a3fa0; }
  .shifttabs button[data-shift="大夜"]{ color:#ff5c5c; }
  .sidebar .shead{
    padding:8px; font-weight:bold; background:#eee; border-bottom:1px solid #ccc;
    display:flex; flex-direction:column; gap:6px;
  }
  .shead-title{ white-space:nowrap; }
  .bed-nav{ display:flex; align-items:center; gap:4px; }
  .bed-nav .nav-btn{
    padding:6px 12px; font-size:18px; cursor:pointer; border:1px solid #999;
    border-radius:4px; background:#fff; flex:0 0 auto;
  }
  .bed-nav .nav-btn:hover{ background:#f0f0f0; }
  .bed-select{
    flex:1; min-width:0; padding:6px 4px; font-size:30px; border:1px solid #999; border-radius:4px;
  }
  .sidebar .plist{ flex:1; overflow-y:auto; }
  .plist .pitem{
    padding:8px 10px; border-bottom:1px solid #eee; cursor:pointer;
  }
  .plist .pitem:hover{ background:#f5faf3; }
  .plist .pitem.active{ background:#8fce8f; color:#fff; }
  .plist .pitem .no{ font-size:18px; color:#888; }

  /* 卡號（Q08xxx）特別放大一倍、粗體、紅色，方便一眼辨識 */
  .cardno{ font-size:2em; font-weight:bold; color:#e02020; }
  #recordShiftLabel{ margin-left:6px; }
  .plist .pitem.active .no{ color:#eaffea; }

  .sidebar .hhead{
    padding:8px; font-weight:bold; background:#eee; border-top:1px solid #ccc; border-bottom:1px solid #ccc;
    display:flex; justify-content:space-between; align-items:center; gap:6px;

  /* 收合「本格存檔狀態」後隱藏內容，讓上面的病床清單（.plist 是 flex:1）自動多分到這塊空間 */
  .sidebar .history.collapsed{ display:none; }

  /* 右側：多頁輸入區 */
  .main{ flex:1; display:flex; flex-direction:column; background:var(--green-bg); overflow:hidden; }

  .tabs{ display:flex; gap:4px; padding:8px 8px 0 8px; background:var(--green-bg); }
  .tabs button{
    flex:1; padding:14px 6px; min-height:70px; line-height:1.5;

  }
  .tabs button.active{ background:var(--pink); color:#fff; font-weight:bold; }

  .recorddate{
    background:var(--green-bg2); padding:6px 12px; display:flex; gap:10px; align-items:center;
    border:none; border-bottom:1px solid #ccc;
  }
  /* 這一列的日期/時間欄位縮小一倍（其他分頁裡的時間欄位不受影響，維持原本的放大字級）
     用 !important 是因為後面全域的 input.f-time 放大規則跟這裡的 specificity 太接近，
     用 !important 才能保證這個小範圍的例外一定生效，不會被蓋掉 */
  .recorddate input{ padding:2px 4px !important; font-size:0.5em !important; }
  .recorddate input#recTime{ width:60px !important; } /* 時間欄位寬度再縮小約 50% */

  .panelwrap{ flex:1; overflow-y:auto; padding:10px 14px; background:var(--green-bg2); border:1px solid var(--border); border-top:none;}

  /* 交班注意事項：A 區（翻身/約束/隔離）、B 區（飲食）各一個藍框區塊 */
  .hblock{ border:3px solid #2f5f8f; border-radius:8px; background:#fff; margin:10px 0; padding:8px 10px; }
  .hblock-title{ font-weight:bold; font-size:20px; color:#fff; background:#2f5f8f; margin:-8px -10px 8px; padding:6px 10px; }
  .hblock .row{ padding:6px 0; }
  .hblock textarea.h-note{ width:100%; box-sizing:border-box; min-height:110px; font-size:20px; padding:6px; border:1px solid #888; border-radius:6px; font-family:inherit; }
  .hblock textarea.h-note.h-note-b{ min-height:220px; }
  .titletext{ min-width:0; line-height:1.2; }
  .titletext > div{ overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .orgline{ font-size:12px; opacity:.85; }
  .h-langbar{ display:flex; flex-wrap:wrap; gap:6px; margin:6px 0; }
  .h-langbar button{ font-size:16px; padding:6px 12px; border:1px solid #2f7f7d; background:#fff; color:#2f7f7d; border-radius:16px; }
  .h-langbar button.active{ background:#2f7f7d; color:#fff; }
  .h-trans-actions{ display:flex; flex-wrap:wrap; gap:8px; margin:6px 0; }
  .h-trans-actions button{ font-size:17px; padding:8px 14px; border-radius:6px; border:1px solid #2f5f8f; background:#eaf3fb; }
  .h-trans-status{ font-size:14px; min-height:18px; }
  .h-trans-body{ font-size:20px; line-height:1.5; border:1px solid #aaa; border-radius:6px; padding:8px; background:#fff; }
  .h-trans-body h4{ margin:10px 0 4px; color:#2f5f8f; }
  .h-trans-body .orig{ font-size:14px; color:#777; }
  .h-head{ font-size:18px; color:#2f5f8f; font-weight:bold; margin:4px 0; }
  .npo{ color:#c00; font-weight:bold; font-size:22px; }
  .tabpanel{ display:none; }
  .tabpanel.active{ display:block; }

  .group{ margin-bottom:16px; }
  .gtitle{ font-weight:bold; color:#2b5d2b; margin-bottom:6px; }

  .row{
    display:flex; flex-wrap:wrap; align-items:center; gap:6px;
    margin-bottom:8px; padding:4px 0;
  }
  .chk{ white-space:nowrap; margin-right:10px; cursor:pointer; }
  .chk input{ margin-right:6px; transform:scale(1.3); }
  .lbl{ color:var(--grey-text); margin:0 4px; }

  /* 無異常/有異常、左側/右側/平躺 這類按鈕式單選 */
  .toggle-btn{ display:inline-flex; margin-right:4px; cursor:pointer; }
  .toggle-btn input{ display:none; }
  .toggle-btn span{
    padding:5px 14px; border:1px solid #aaa; border-radius:4px; background:#eee; font-size:18px;
  }
  .toggle-btn input:checked + span{ background:var(--blue); color:#fff; border-color:var(--blue);}
  .toggle-btn input:disabled + span{ opacity:.4; cursor:not-allowed; }

  .subs{ margin-left:6px; }
  .subs .chk{ font-size:18px; color:#555; }

  input[disabled]{ background:#eee; color:#999; }

  input[type=text].f-text, input[type=number].f-num, input.f-time{
    border:1px solid #aaa; border-radius:3px; padding:6px 9px; font-size:2em;
  }
  .unit{ margin:0 6px 0 2px; color:var(--grey-text); font-size:18px; }
  .toggle-btn.banned{ opacity:.4; text-decoration:line-through; }
  .toggle-btn.banned input:checked + span{ background:#e05a5a; color:#fff; }
  .pos-pair{ display:inline-flex; align-items:center; gap:2px; margin-right:16px; }

  table.iotable{ border-collapse:collapse; margin-top:6px; width:100%; max-width:600px; }
  table.iotable th, table.iotable td{ border:1px solid #7fc9c9; padding:7px 10px; text-align:center; }
  table.iotable th{ background:#5fd0cd; color:#fff; }
  table.iotable tr.total td{ background:#bfe6bf; font-weight:bold; }
  table.iotable input{ width:150px; text-align:center; font-size:2em; }
  .delrow-btn, .feed-delrow-btn{
    background:#e05a5a; color:#fff; border:none; border-radius:4px;
    width:32px; height:32px; line-height:1; cursor:pointer; font-size:20px;
  }
  .delrow-btn:hover, .feed-delrow-btn:hover{ background:#c94848; }
  .addrow-btn{ margin-top:6px; padding:6px 14px; cursor:pointer; }
  .zero-btn{
    margin-left:8px; background:#fff3d6; border:1px solid #d9a441; color:#8a5a00;
  }
  .zero-btn:hover{ background:#ffe7b3; }

  /* 凍結 5-3 輸出入量表格（尿/引流/屎/尿與屎）的表頭：
     手機輸入時往下捲動新增列，欄位名稱還是能一直看到，不用一直往上滑確認。
     跟電子版組別分配表一樣，用 border-collapse:separate 避免 sticky 在部分瀏覽器下的邊框異常。 */
  table.outputtable{ border-collapse:separate; border-spacing:0; }
  table.outputtable th{ position:sticky; top:0; z-index:2; }

  /* 5-5 餵食紀錄表：時間欄位獨立配色，小計是跨列合併、整張表加總的黃色大格 */
  table.feedtable input.feed-time{ width:150px; }

  /* 4-1 翻身/拍背（舒適與活動分頁）的時間欄位，寬度縮減約一半，
     只影響 #tab4 這個分頁裡的時間欄位，其他分頁的時間欄位維持原本寬度 */
  #tab4 input.f-time{ width:150px; }
  table.feedtable tr.total td{ background:#ffdca0; } /* 橘色合計列，貼近原表格配色 */
  table.feedtable .feed-grandtotal{
    background:#fff44f; font-weight:bold; font-size:1.3em; vertical-align:middle;
  }

  /* 電子版｜組別分配表：下拉選單直接對應顏色本身（無色/藍色/紅色/綠色） */
  table.grouptable{ max-width:none; border-collapse:separate; border-spacing:0; }
  table.grouptable th{ white-space:nowrap; }
  .grouptable-bed{ font-weight:bold; white-space:nowrap; background:#f5f5f5; }

  /* 凍結表頭列＋最左邊「床號｜卡號」那一欄：
     - 表頭列：垂直捲動表格時固定在最上面，隨時看得到白班2組/白班3組/小夜2組/大夜2組這些欄名
     - 最左欄：水平捲動時固定不動，隨時能對照目前看到的是哪一床
     - 左上角那一格兩個方向都要凍結，z-index 要比其他表頭、其他左欄都高，不然捲動時會被蓋掉
     全部都要給不透明背景色，不然捲動時後面的內容會透出來。 */
  table.grouptable th{ position:sticky; top:0; z-index:3; }
  table.grouptable th:first-child,
  table.grouptable td:first-child{
    position:sticky; left:0; z-index:2;
  }
  table.grouptable th:first-child{ z-index:4; background:#5fd0cd; }
  table.grouptable td:first-child{ box-shadow:2px 0 4px rgba(0,0,0,.15); } /* 一條淡淡陰影，提示這欄是浮在上面凍結住的 */
  select.group-select{
    font-size:1em; padding:6px 8px; border:1px solid #999; border-radius:4px;
    background:transparent; color:#333; min-width:110px;
  }
  select.group-select.grp-blue{ background:#2255cc; color:#fff; border-color:#2255cc; }
  select.group-select.grp-red{ background:#cc2222; color:#fff; border-color:#cc2222; }
  select.group-select.grp-green{ background:#228833; color:#fff; border-color:#228833; }
  .group-legend{
    display:inline-block; padding:4px 12px; border-radius:4px; font-weight:bold;
    margin-right:8px; color:#fff;
  }
  .group-legend.grp-blue{ background:#2255cc; }
  .group-legend.grp-red{ background:#cc2222; }
  .group-legend.grp-green{ background:#228833; }
  .group-legend.grp-none{ background:transparent; color:#333; border:1px dashed #999; }

  .statusbar{
    background:#eee; border-top:1px solid #ccc; padding:4px 12px; font-size:18px; color:#555;
    display:none; justify-content:space-between;
    /* 依需求隱藏最下面這一列，不佔畫面空間；文字內容還是照樣在背景更新，
       只是不顯示出來，之後想要恢復顯示，把 display:none 拿掉就好 */
  }

  /* 說明區塊 */
  .note{ font-size:18px; color:#777; margin:4px 0 10px; }

  /* ====== 手機版（含平板直式）版面調整 ======
     設計方式：桌機時左側清單、右側輸入區並排；
     窄螢幕時左側清單改成「側拉抽屜」，用左上角漢堡選單開關，
     這樣手機直向操作時右側的輸入表單才有足夠寬度可以點選。 */
  @media (max-width: 820px){
    .menu-btn{ display:inline-flex; align-items:center; justify-content:center; }
    .titlebar > div:not(.menu-btn){ font-size:18px; }

    .toolbar{ padding:6px 8px; }
    .toolbar button{ padding:6px 8px; font-size:15px; }
    .toolbar .hk{ display:none; }
    .toolbar button{ padding:6px 6px; font-size:14px; }
    .toolbar .sep{ display:none; }
    .toolbar .note{ display:none; } /* 手機畫面窄，說明文字先隱藏，避免擠壓按鈕 */

    .modal-box{ width:100%; max-height:94vh; }
    .modal-header{ font-size:18px; }
    .bf-row{ flex-direction:column; align-items:stretch; gap:4px; }
    .bf-row label{ width:auto; }

    .patientbar{ font-size:18px; gap:6px 10px; padding:6px 8px 6px 0; }
    .toggle-patientbar-btn{ padding:6px 12px; font-size:16px; }

    .sidebar{
      position:fixed; top:0; left:0; bottom:0; z-index:50;
      width:82vw; max-width:320px;
      transform:translateX(-105%);
      transition:transform .25s ease;
      box-shadow:2px 0 10px rgba(0,0,0,.35);
    }
    .sidebar.open{ transform:translateX(0); }

    .bed-nav .nav-btn{ padding:8px 12px; font-size:18px; }
    .bed-select{ padding:8px 6px; font-size:26px; }
    .login-box input{ font-size:32px; }
    .toggle-history-btn{ padding:6px 12px; font-size:17px; }

    .tabs{ padding:6px 6px 0; }
    .tabs button{ font-size:19px; padding:16px 4px; min-height:90px; line-height:1.5; }

    .recorddate{ font-size:20px; flex-wrap:wrap; }

    .panelwrap{ padding:8px 10px; }
    .row{ gap:8px 10px; }

    /* 放大可點擊區域，手指比滑鼠游標大很多 */
    .chk{ min-height:34px; display:inline-flex; align-items:center; margin-right:12px; }
    .chk input, input[type=checkbox], input[type=radio]{ transform:scale(1.25); margin-right:6px; }
    .toggle-btn span{ padding:6px 12px; font-size:20px; }
    input.f-time{ min-width:120px; padding:6px; }
    input[type=number].f-num{ padding:6px; }
    table.iotable input{ width:108px; }
    table.feedtable input.feed-time{ width:140px; }
    .delrow-btn, .feed-delrow-btn{ width:32px; height:32px; font-size:22px; }

    .statusbar{ font-size:16px; flex-wrap:wrap; gap:2px 8px; }

    /* ====== 手機直列版：表格改成「一筆一張卡片」由上往下排 ======
       比喻：桌機像 Excel 的一整排格子，手機像名片盒，每筆資料抽成一張名片，
       不需要左右捲動。純 CSS，資料結構與欄位 name 完全不變。 */
    table.outputtable, table.feedtable{ max-width:none; border-collapse:separate; }
    table.outputtable thead, table.feedtable thead{ display:none; }
    table.outputtable, table.outputtable tbody, table.outputtable tfoot, table.outputtable tr, table.outputtable td,
    table.feedtable, table.feedtable tbody, table.feedtable tr, table.feedtable td{ display:block; width:100%; box-sizing:border-box; }
    table.outputtable tbody, table.feedtable tbody{ counter-reset:rec; }
    table.outputtable tbody tr, table.feedtable tr.feed-row{
      counter-increment:rec; position:relative;
      border:1px solid #7fc9c9; border-radius:10px; background:#fff;
      margin:10px 0; padding:8px 10px 6px;
    }
    table.outputtable tbody tr::before, table.feedtable tr.feed-row::before{
      content:"第 " counter(rec) " 筆"; display:block; font-weight:bold; color:#2f7f7d; margin-bottom:4px;
    }
    table.outputtable td, table.feedtable td{ border:none; padding:4px 0; text-align:left; }
    table.outputtable tbody td[data-label], table.feedtable tr.feed-row td[data-label]{
      display:flex; align-items:center; justify-content:space-between; gap:10px;
    }
    table.outputtable td[data-label]::before, table.feedtable td[data-label]::before{
      content:attr(data-label); font-size:20px; color:#2f7f7d; font-weight:bold; flex:0 0 auto;
    }
    table.outputtable td input, table.feedtable td input{ flex:1 1 auto; width:60%; min-width:0; max-width:240px; }
    td.delcell{ position:absolute; top:6px; right:8px; width:auto !important; padding:0 !important; }
    /* 合計卡片 */
    table.outputtable tfoot tr, table.feedtable tr.total{
      border:1px solid #6fb36f; border-radius:10px; background:#bfe6bf; margin:10px 0; padding:8px 10px;
    }
    table.feedtable tr.total{ background:#ffdca0; border-color:#d9a441; }
    table.outputtable tfoot td[data-label], table.feedtable tr.total td[data-label]{
      display:flex; justify-content:space-between; background:transparent; font-size:22px;
    }
    table.outputtable tfoot td:empty, table.feedtable tr.total td:empty{ display:none; }

<script>
/* ============================================================
   A13 照護紀錄輸入系統
   設計理念：
   1. 用「病人 Patient」與「照護紀錄 Record」建立資料模型，
      每筆 Record 底下的欄位用「扁平化的 name/value」儲存，
      這樣存檔、讀檔、轉 XML 都可以用同一套通用邏輯處理，
      不用替每一種輸入元件各寫一套轉換規則。
   2. 畫面上的每一小項（1-1、1-2…）用小函式拼出 HTML，
      函式名稱對應「這一項長什麼樣子」，方便之後增減項目。
   3. 「有異常才能勾選細項」這種連動邏輯，統一用
      data-depends="欄位名:應該的值" 描述，由一個共用函式
      掃描全表單來決定要不要 disable，不用每個欄位各寫一段。
   ============================================================ */

/* ---------- 小工具：畫面元件產生器（atom functions） ---------- */

// 一般核取方塊
function cb(name, label, depends){
  return `<label class="chk"${depends?` data-depends="${depends}"`:''}>`+
         `<input type="checkbox" name="${name}" value="true"${depends?` data-depends="${depends}"`:''}> ${label}</label>`;
}

// 按鈕式單選（例如：無異常/有異常、左側/右側/平躺）
function radioGroup(name, labels, values, depends){
  return labels.map((l,i)=>{
    return `<label class="toggle-btn">`+
           `<input type="radio" name="${name}" value="${values[i]}"${depends?` data-depends="${depends}"`:''}>`+
           `<span>${l}</span></label>`;
  }).join('');
}

// 注意：這裡刻意不用瀏覽器原生的 <input type="time">。
// 原生時間欄位要顯示 12 小時制(上午/下午)還是 24 小時制，是看瀏覽器/作業系統的地區設定，
// 網頁的 lang 屬性影響不了它——這也是為什麼即使設定 lang="zh-TW" 還是可能跳出「上午 01:19」。
// 改用純文字欄位＋自己寫的簡單格式化（見 setupTimeFieldFormatting），才能保證一定是 24 小時制 HH:MM。
function timeInput(name, depends){
  return `<input type="text" class="f-time" name="${name}" placeholder="HH:MM" inputmode="numeric" maxlength="5"${depends?` data-depends="${depends}"`:''}>`;
}
function numInput(name, unit, depends, width){
  return `<input type="number" class="f-num" inputmode="numeric" style="width:${width||100}px" name="${name}"${depends?` data-depends="${depends}"`:''}>`+
         (unit?`<span class="unit">${unit}</span>`:'');
}
function textInput(name, placeholder, depends, width){
  return `<input type="text" class="f-text" style="width:${width||220}px" name="${name}" placeholder="${placeholder||''}"${depends?` data-depends="${depends}"`:''}>`;
}

/* ---------- 常用組合元件（一個項目常見的樣式） ---------- */

// 「打勾＋無異常/有異常＋異常細項」的一整列，例如 1-1 頭部清潔
function actionRow(id, label, subs, statusLabels){
  statusLabels = statusLabels || ['無異常','有異常'];
  const doneName = id+'_done', statusName = id+'_status';
  const dep1 = `${doneName}:true`;
  const dep2 = `${doneName}:true;${statusName}:abnormal`;
  const subsHtml = subs.map((s,i)=>cb(`${id}_sub${i}`, s, dep2)).join('');
  return `<div class="row">
      ${cb(doneName,label)}
      ${radioGroup(statusName, statusLabels, ['normal','abnormal'], dep1)}
      <span class="subs">${subsHtml}</span>
    </div>`;
}

// 單純「敘述文字＋無/有」，沒有前面的打勾（例如 5-1 使用冰枕）
function toggleRow(id, label, opts){
  opts = opts || ['無','有'];
  const statusName = id+'_status';
  return `<div class="row"><span class="lbl">${label}</span>${radioGroup(statusName, opts, ['none','has'])}</div>`;
}

// 一列多個各自獨立的打勾項目
function checkRow(items){
  return `<div class="row">${items.map(([n,l])=>cb(n,l)).join('')}</div>`;
}

// 打勾＋次數＋時間（例如 1-6 換尿布）
function countTimeRow(id, label, unit, timeLabel){
  const doneName=id+'_done', dep=`${doneName}:true`;
  return `<div class="row">${cb(doneName,label)} ${numInput(id+'_count',unit,dep,85)} <span class="lbl">，${timeLabel}</span> ${timeInput(id+'_time',dep)}</div>`;
}

// 打勾＋多個時間欄位（例如 3-1 鼻胃管灌食）
function timeSlotsRow(id, label, count){
  const doneName=id+'_done', dep=`${doneName}:true`;
  let slots=''; for(let i=0;i<count;i++) slots+=timeInput(`${id}_t${i}`,dep);
  return `<div class="row">${cb(doneName,label)}${slots}</div>`;
}

// 主勾選＋「協助：」＋一串同層細項（例如 1-8 更換床單）
function compoundCheckRow(id, mainLabel, subLabel, subs){
  const doneName=id+'_done', dep=`${doneName}:true`;
  const subsHtml = subs.map((s,i)=>cb(`${id}_sub${i}`,s,dep)).join('');
  return `<div class="row">${cb(doneName,mainLabel)} ${subLabel?`<span class="lbl">${subLabel}</span>`:''} ${subsHtml}</div>`;
}

// 一列文字說明＋多個各自獨立的打勾（例如 4-5 病人四肢狀況）
function multiCheckLabelRow(label, items){
  return `<div class="row"><span class="lbl">${label}</span>${items.map(([n,l])=>cb(n,l)).join('')}</div>`;
}

// 一個打勾控制多組「文字＋無/有」（例如 4-1 觀察皮膚情形，破皮/紅疹/異味）
function multiToggleRow(id, mainLabel, toggles){
  const doneName=id+'_done', dep=`${doneName}:true`;
  const html = toggles.map(([n,l])=>`<span class="lbl">，${l}</span>${radioGroup(n,['無','有'],['none','has'],dep)}`).join('');
  return `<div class="row">${cb(doneName,mainLabel)}${html}</div>`;
}

// 翻身紀錄：多列，每列多組「時間＋左側/右側/平躺」，第一列加禁忌欄
function positionRows(id, rowsCount, pairsPerRow, tabooId){
  let out='';
  for(let r=0;r<rowsCount;r++){
    let pairs='';
    for(let p=0;p<pairsPerRow;p++){
      const idx = r*pairsPerRow+p;
      pairs += `<span class="pos-pair">${timeInput(`${id}_r${idx}_time`)} ${radioGroup(`${id}_r${idx}_pos`,['左側','右側','平躺'],['left','right','lying'])}</span>`;
    }
    const taboo = (tabooId && r===0) ? `<span class="lbl">其他禁忌</span>${textInput(tabooId,'',null,300)}` : '';
    out += `<div class="row">${pairs}${taboo}</div>`;
  }
  return out;
}

function group(code, title, inner){
  return `<div class="group"><div class="gtitle">${code} ${title}</div>${inner}</div>`;
}

/* ================= 分頁 6：電子版組別分配 =================
   跟前面 5 個分頁不一樣：這裡不是「某一床、某一班別」各自的照護紀錄，
   而是「31 床共用的一張表」——每一床在 4 個分組欄位裡各自標成一種顏色，
   資料索引鍵是「卡號」，跟目前選到哪一床、哪個班別完全無關，所以另外存成一份獨立的
   Firestore 文件（見 loadGroupAssignments / saveGroupAssignments），
   不會混進 patients[].slots 那一套「班別+床號」的資料模型裡。 */
const GROUP_COLUMNS = ['白班2組','白班3組','小夜2組','大夜2組'];
// 下拉選單共 4 種：無色(透明)／藍色／紅色／綠色。value 直接用顏色名稱，
// 這樣存進 Firestore 的資料本身就是「人看得懂的顏色」，不用再去對照 A/B/C 是什麼意思。
const GROUP_COLORS = { blue:'藍色', red:'紅色', green:'綠色' };
let groupAssignments = {}; // { 卡號: { 白班2組:'blue', 白班3組:'', ... } }

function groupSelectClass(val){
  return val==='blue' ? 'grp-blue' : val==='red' ? 'grp-red' : val==='green' ? 'grp-green' : '';
}

function buildTab6(){
  const rows = patients.map(p=>{
    const card = p.info.卡號;
    const saved = groupAssignments[card] || {};
    const cells = GROUP_COLUMNS.map(col=>{
      const val = saved[col] || '';
      const opts = ['', 'blue', 'red', 'green'].map(v=>{
        const label = v==='' ? '無色（透明）' : GROUP_COLORS[v];
        return `<option value="${v}"${v===val?' selected':''}>${label}</option>`;
      }).join('');
      return `<td><select class="group-select ${groupSelectClass(val)}" data-card="${card}" data-col="${col}">${opts}</select></td>`;
    }).join('');
    return `<tr><td class="grouptable-bed">${p.info.床號||''}<br>${card}</td>${cells}</tr>`;
  }).join('');

  return `<div class="group">
    <div class="gtitle">電子版｜組別分配（${patients.length} 床）</div>
    <div class="row">
      <span class="lbl">顏色</span>
      <span class="group-legend grp-blue">藍色</span>
      <span class="group-legend grp-red">紅色</span>
      <span class="group-legend grp-green">綠色</span>
      <span class="group-legend grp-none">無色（透明）</span>
      <span class="lbl" id="groupStatus" style="margin-left:16px;"></span>
    </div>
    <div style="overflow-x:auto;">
      <table class="iotable grouptable">
        <thead><tr><th>床號｜卡號</th>${GROUP_COLUMNS.map(c=>`<th>${c}</th>`).join('')}</tr></thead>
        <tbody id="groupTableBody">${rows}</tbody>
      </table>
    </div>
  </div>`;
}

/* ---------- 電子版組別分配：讀取／寫入雲端（跟每床的照護紀錄分開存） ---------- */
async function loadGroupAssignments(){
  try{
    const snap = await db.collection('a13groupassignment').doc(orgPrefix() + 'main').get();
    groupAssignments = (snap.exists && snap.data().assignments) ? snap.data().assignments : {};
  }catch(err){
    console.error('讀取組別分配失敗，暫時使用空白資料：', err);
    groupAssignments = groupAssignments || {};
  }
}
async function saveGroupAssignments(){
  const statusEl = document.getElementById('groupStatus');
  if(statusEl) statusEl.textContent = '同步中...';
  try{
    const updatedBy = auth.currentUser ? auth.currentUser.email : '';
    const updatedAt = new Date().toLocaleString('zh-TW',{hour12:false});
    await db.collection('a13groupassignment').doc(orgPrefix() + 'main').set({
      company: ORG.company, department: ORG.department, orgId: ORG.id, assignments: groupAssignments, updatedBy, updatedAt
    });
    if(statusEl) statusEl.textContent = `已同步（${updatedBy} ${updatedAt}）`;
  }catch(err){
    console.error('寫入組別分配失敗：', err);
    if(statusEl) statusEl.textContent = '同步失敗，請檢查網路連線';
  }
}
document.addEventListener('change', (e)=>{
  if(!e.target.classList.contains('group-select')) return;
  const card = e.target.dataset.card, col = e.target.dataset.col, val = e.target.value;
  if(!groupAssignments[card]) groupAssignments[card] = {};
  groupAssignments[card][col] = val;
  e.target.className = 'group-select ' + groupSelectClass(val);
  saveGroupAssignments();
});

/* ================= 病床資料管理（CRUD） =================
   床號/病歷號/姓名/性別/出生/年齡/卡號/醫師/科別/身份/管路/血型/診斷，
   這 13 個欄位是整個 A13 系統所有照護紀錄輸入的「底」。跟每床每班別的照護紀錄、
   電子版組別分配一樣，這份資料也是全部病床共用的一份，用卡號當唯一識別碼，
   獨立存在 Firestore 的 a13patients 集合裡，一床一份文件。 */
const PATIENTS_COLLECTION = 'a13patients';
const PATIENT_FIELDS = ['床號','病歷號','姓名','性別','出生','年齡','卡號','醫師','科別','身份','管路','血型','診斷'];

function blankSlots(){
  const s = {};
  SHIFTS.forEach(sh=>{ s[sh] = { fields:{}, date:'', time:'', saved:false, savedAt:'' }; });
  return s;
}

async function savePatientToCloud(info){
  await db.collection(PATIENTS_COLLECTION).doc(orgPrefix() + info.卡號).set(Object.assign({}, info, { 公司: ORG.company, 部門: ORG.department, orgId: ORG.id }));
}
async function deletePatientFromCloud(cardNo){
  await db.collection(PATIENTS_COLLECTION).doc(orgPrefix() + cardNo).delete();
}

// 登入後呼叫：雲端還沒有病床資料（第一次使用）就把內建的示範資料上傳上去、之後都以雲端為準；
// 雲端已經有資料，就整批換成雲端版本（卡號相同的病人沿用本地既有的 slots 草稿，不會不見）。
async function loadPatientsFromCloud(){
  try{
    const snap = await db.collection(PATIENTS_COLLECTION).get();
    const cloudInfos = [];
    snap.forEach(doc=>{
      const d = doc.data();
      if(!inCurrentOrg(d)) return; // 只取目前單位的病床
      delete d.公司; delete d.部門; delete d.orgId; // 這些只是雲端標記，不屬於病人基本資料
      cloudInfos.push(d);
    });
    if(!cloudInfos.length){
      if(ORG.id === 'default'){
        // 原始單位第一次使用：把內建示範資料上傳
        await Promise.all(patients.map(p=>savePatientToCloud(p.info)));
        return;
      }
      // 新單位：病床清單從一床「空白床」開始，再到「病床資料管理」新增／修改
      const info = {};
      PATIENT_FIELDS.forEach(f=>{ info[f] = ''; });
      Object.assign(info, { 床號:'01床', 姓名:'（請到病床資料管理修改）', 卡號:'A001' });
      patients.length = 0;
      patients.push({ info, slots: blankSlots() });
      currentPatientIndex = 0;
      await savePatientToCloud(info);
      return;
    }
    const rebuilt = cloudInfos.map(info=>{
      const existing = patients.find(p=>p.info.卡號 === info.卡號);
      return { info, slots: existing ? existing.slots : blankSlots() };
    });
    patients.length = 0;
    rebuilt.forEach(p=>patients.push(p));
    if(currentPatientIndex >= patients.length) currentPatientIndex = 0;
  }catch(err){
    console.error('載入病床基本資料失敗，暫時使用內建示範資料：', err);
  }
}

function showBedCrudList(){
  document.getElementById('bedCrudListView').style.display = '';
  document.getElementById('bedCrudForm').style.display = 'none';
  document.getElementById('bf_warn').textContent = '';
}

// index 為 null 表示「新增病床」；index 為數字表示「編輯 patients[index]」
function openBedForm(index){
  const bform = document.getElementById('bedCrudForm');
  document.getElementById('bedCrudListView').style.display = 'none';
  bform.style.display = 'flex';
  document.getElementById('bf_warn').textContent = '';
  const info = (index != null) ? patients[index].info : {};
  document.getElementById('bf_originalCardNo').value = (index != null) ? (info.卡號||'') : '';
  PATIENT_FIELDS.forEach(f=>{
    const el = document.getElementById('bf_'+f);
    if(el) el.value = info[f] || (f==='性別' && index==null ? '男' : '');
  });
  bform.dataset.editIndex = (index != null) ? String(index) : '';
}

document.getElementById('bedCrudForm').addEventListener('submit', async (e)=>{
  e.preventDefault();
  const warnEl = document.getElementById('bf_warn');
  const newInfo = {};
  PATIENT_FIELDS.forEach(f=>{ newInfo[f] = document.getElementById('bf_'+f).value.trim(); });
  if(!newInfo.床號 || !newInfo.病歷號 || !newInfo.姓名 || !newInfo.卡號){
    warnEl.textContent = '床號、病歷號、姓名、卡號為必填。';
    return;
  }
  const editIndexStr = e.target.dataset.editIndex;
  const isEdit = editIndexStr !== '';
  const originalCardNo = document.getElementById('bf_originalCardNo').value;

  // 卡號是這套系統的唯一識別碼，新增/編輯時都要檢查有沒有跟別床撞號
  const dupIdx = patients.findIndex((p,i)=> p.info.卡號 === newInfo.卡號 && (!isEdit || i !== Number(editIndexStr)));
  if(dupIdx >= 0){
    warnEl.textContent = `卡號 ${newInfo.卡號} 已經被「${patients[dupIdx].info.床號} ${patients[dupIdx].info.姓名}」使用，請換一個卡號。`;
    return;
  }

  if(isEdit){
    const idx = Number(editIndexStr);
    const changingKey = originalCardNo && originalCardNo !== newInfo.卡號;
    if(changingKey){
      const ok = confirm(
        `卡號從 ${originalCardNo} 改成 ${newInfo.卡號}，這位病人先前存過的照護紀錄會找不到對應（等於從空白重新開始累積）。\n確定要更改卡號嗎？`
      );
      if(!ok) return;
    }
    patients[idx].info = newInfo;
    try{
      await savePatientToCloud(newInfo);
      if(changingKey) await deletePatientFromCloud(originalCardNo); // 換卡號了，把舊文件刪掉避免留下孤兒資料
    }catch(err){
      warnEl.textContent = '同步雲端失敗，請檢查網路連線後再試一次。';
      return;
    }
  } else {
    patients.push({ info:newInfo, slots: blankSlots() });
    try{
      await savePatientToCloud(newInfo);
    }catch(err){
      patients.pop();

});

/* ---------- 依賴（連動 disable）引擎 ---------- */
function evalDepends(condStr){
  return condStr.split(';').every(pair=>{
    const [name,val] = pair.split(':');
    const el = form.elements[name];
    if(!el) return false;
    if(el instanceof RadioNodeList){
      return el.value === val; // RadioNodeList.value 會回傳目前被選取的那個 value
    }
    if(el.type === 'checkbox') return String(el.checked) === val;
    return el.value === val;
  });
}
// 依「禁翻身方向」勾選狀態，標記 4-1 各列對應方向的按鈕為「禁止」（只換樣式，不改資料）
function updateBans(){
  const map = { c4_41_ban_left:'left', c4_41_ban_lying:'lying', c4_41_ban_right:'right' };
  Object.keys(map).forEach(name=>{
    const box = form.querySelector(`input[name="${name}"]`);
    const on = !!(box && box.checked);
    form.querySelectorAll(`input[type=radio][name^="c4_41_r"][value="${map[name]}"]`).forEach(r=>{
      r.closest('label').classList.toggle('banned', on);
    });
  });
}
// 被禁止的方向不能再點選（已經選了的不動，要改請先取消禁止）
document.addEventListener('click', e=>{
  const r = e.target;
  if(r.matches && r.matches('input[type=radio][name^="c4_41_r"]') && r.closest('label').classList.contains('banned') && !r.checked){
    e.preventDefault();
  }
}, true);

function updateDependencies(){
  form.querySelectorAll('[data-depends]').forEach(el=>{
    const ok = evalDepends(el.dataset.depends);
    el.disabled = !ok;
    if(!ok){
      if(el.type==='checkbox' || el.type==='radio') el.checked = false;
      else el.value = '';
    }
  });
  updateBans();
}

/* ---------- 5-3 動態表格（可新增、可刪除列） ----------
   idx 用來組成每個輸入框的 name（例如 c5_53_tbl_3_pee），
   用一個只會遞增、不會重複使用的計數器 outputRowSeq 來產生 idx，
   這樣「刪除中間那列、再新增一列」也不會撞名。
   讀取舊紀錄時（loadRecord）則改用 addTableRowWithIndex，
   直接沿用該筆紀錄原本存的 idx，欄位才能正確對回去。 */
let outputRowSeq = 0;

function createOutputRow(idx){
  const tr = document.createElement('tr');
  tr.innerHTML = `
    <td data-label="尿 U"><input type="number" inputmode="numeric" class="tbl-pee" name="c5_53_tbl_${idx}_pee"></td>
    <td data-label="引流"><input type="number" inputmode="numeric" class="tbl-drain" name="c5_53_tbl_${idx}_drain"></td>
    <td data-label="屎 S"><input type="number" inputmode="numeric" class="tbl-stool" name="c5_53_tbl_${idx}_stool"></td>
    <td data-label="尿與屎 US"><input type="number" inputmode="numeric" class="tbl-mix" name="c5_53_tbl_${idx}_mix"></td>
    <td class="delcell"><button type="button" class="delrow-btn" title="刪除此列">✕</button></td>`;
  return tr;
}

function addTableRow(){
  const tbody = document.getElementById('outputTableBody');
  const idx = outputRowSeq++;
  tbody.appendChild(createOutputRow(idx));
}

function addTableRowWithIndex(idx){
  const tbody = document.getElementById('outputTableBody');
  tbody.appendChild(createOutputRow(idx));
  if(idx >= outputRowSeq) outputRowSeq = idx + 1;
}

function deleteTableRow(trEl){
  const tbody = document.getElementById('outputTableBody');
  if(tbody.children.length <= 1){
    alert('至少要保留一列。');
    return;
  }
  trEl.remove();
  recalcTotals(true);
}

document.addEventListener('input', (e)=>{
  if(e.target.matches('#outputTableBody input')) recalcTotals(true);
});
// autoFill=true（使用者輸入／刪列／歸零時）：把表格加總自動帶入 5-3 上方的輸出量欄位；
// 讀取舊紀錄時不帶入，避免蓋掉原本存的值。
//   尿合計   → 尿液(cc)         引流合計 → 引流量(cc)
//   屎合計   → 排便(gm)，排便「次數」＝屎欄位有填數字（>0）的筆數
//   尿與屎合計 → 其他：「N次 US:合計cc」（N＝尿與屎欄位有填數字的筆數）
function recalcTotals(autoFill){
  const cols = ['pee','drain','stool','mix'];
  const sums = {}, counts = {};
  cols.forEach(c=>{
    let sum = 0, cnt = 0;
    document.querySelectorAll(`.tbl-${c}`).forEach(inp=>{
      const n = Number(inp.value)||0; sum += n; if(n > 0) cnt++;
    });
    sums[c] = sum; counts[c] = cnt;
    document.getElementById(`total_${c}`).textContent = sum;
  });
  if(autoFill){
    const put = (name, v)=>{ const el = form.elements[name]; if(el) el.value = v; };
    put('c5_53_urine', sums.pee ? String(sums.pee) : '');
    put('c5_53_drain', sums.drain ? String(sums.drain) : '');
    put('c5_53_stoolweight', sums.stool ? String(sums.stool) : '');
    put('c5_53_stoolcount', counts.stool ? String(counts.stool) : '');
    put('c5_53_other', sums.mix ? `${counts.mix}次 US:${sums.mix}cc` : '');
  }
}

/* 表格數字欄位的輸入保護：
   1) 點進欄位時整格選取，直接輸入就是取代，不會接在舊數字後面；
   2) 離開欄位時把「01200」「0400」這類前面多餘的 0 去掉；0 就顯示成空白。 */
document.addEventListener('focusin', e=>{
  if(e.target.matches && e.target.matches('#outputTableBody input, #feedTableBody input.feed-milk, #feedTableBody input[type=number]')) setTimeout(()=>{ try{ e.target.select(); }catch(_){} }, 0);
});
document.addEventListener('focusout', e=>{
  const el = e.target;
  if(!(el.matches && el.matches('#outputTableBody input, #feedTableBody input[type=number]'))) return;
  if(el.value === '') return;
  const n = Number(el.value);
  const clean = (isFinite(n) && n !== 0) ? String(n) : '';
  if(clean !== el.value){
    el.value = clean;
    el.dispatchEvent(new Event('input', {bubbles:true}));
  }
});

// 「歸零」：把目前這一格（班別＋床號＋姓名＋照顧紀錄日期，也就是現在畫面上看到的這一格）
// 的尿／引流／屎／尿與屎表格，所有已輸入的數值都清成空白＝0（不刪列，合計會變 0），
// 並且立刻同步存回雲端，避免歸零之後忘記按存檔、其他裝置看到的還是舊數字。
async function zeroOutputTable(){
  const p = patients[currentPatientIndex].info;
  const dateStr = document.getElementById('recDate').value || '（未填日期）';
  const timeStr = document.getElementById('recTime').value || '';
  const ok = confirm(
    `確定要將「${currentShift}．${p.床號} ${p.姓名}．${dateStr} ${timeStr}」這一格的\n尿／引流／屎／尿與屎 數值全部歸零嗎？（會同步清空雲端資料）`
  );
  if(!ok) return;
  // 歸零後欄位清成「空白」而不是顯示 0：避免游標在 0 前面輸入時變成 01200 之類的十倍錯誤
  document.querySelectorAll('#outputTableBody input').forEach(inp=>{ inp.value = ''; });
  recalcTotals(true);
  const slot = getCurrentSlot();
  captureFormIntoSlot(slot);
  await saveSlotToCloud(currentPatientIndex, currentShift, slot);
  renderSlotStatus();
  updateStatusRight();
  document.getElementById('statusLeft').textContent = '已將輸出入量表格歸零並同步雲端';
}

// 綁定新增列／刪除列／歸零按鈕（buildTab5 用 innerHTML 產生，需在 init 之後綁定，
// 用事件委派最簡單）
document.addEventListener('click', (e)=>{
  if(e.target.id === 'btnAddRow'){ addTableRow(); recalcTotals(true); }
  if(e.target.classList.contains('delrow-btn')){ deleteTableRow(e.target.closest('tr')); }

});

/* ---------- 5-5 餵食紀錄表（可新增、可刪除列，多一欄跨列合併的「小計」） ----------
   欄位命名規則跟 5-3 一樣：c5_55_tbl_{idx}_{欄位}，idx 用只會遞增的計數器 feedRowSeq。
   「小計」不是每一列自己的欄位，而是整張表所有數字欄位加總後的結果，
   用一個 rowspan 隨列數自動調整的儲存格顯示在第一列，新增/刪除列時重新計算要跨幾列。
   （刻意不跟 5-3 共用 .delrow-btn 這個 class，避免「刪除列」的事件委派誤觸到別張表。） */
let feedRowSeq = 0;
const FEED_COLS = ['milk','water1','protein','medwater','water2','other'];

function createFeedRow(idx){
  const tr = document.createElement('tr');
  tr.className = 'feed-row';
  tr.innerHTML = `
    <td data-label="餵食奶"><input type="number" inputmode="numeric" class="feed-milk" name="c5_55_tbl_${idx}_milk"></td>
    <td data-label="餵食水"><input type="number" inputmode="numeric" class="feed-water1" name="c5_55_tbl_${idx}_water1"></td>
    <td data-label="餵食高蛋白"><input type="number" inputmode="numeric" class="feed-protein" name="c5_55_tbl_${idx}_protein"></td>
    <td data-label="藥+水"><input type="number" inputmode="numeric" class="feed-medwater" name="c5_55_tbl_${idx}_medwater"></td>
    <td data-label="餵水"><input type="number" inputmode="numeric" class="feed-water2" name="c5_55_tbl_${idx}_water2"></td>
    <td data-label="其他餵食"><input type="number" inputmode="numeric" class="feed-other" name="c5_55_tbl_${idx}_other"></td>
    <td data-label="時間"><input type="text" class="feed-time f-time" name="c5_55_tbl_${idx}_time" placeholder="HH:MM" inputmode="numeric" maxlength="5"></td>
    <td class="delcell"><button type="button" class="feed-delrow-btn" title="刪除此列">✕</button></td>`;
  return tr;
}

function addFeedRow(){
  const tbody = document.getElementById('feedTableBody');
  const totalRow = document.getElementById('feedTotalRow');
  const idx = feedRowSeq++;
  tbody.insertBefore(createFeedRow(idx), totalRow);
  updateFeedGrandTotalCell();
}

function addFeedRowWithIndex(idx){
  const tbody = document.getElementById('feedTableBody');
  const totalRow = document.getElementById('feedTotalRow');
  tbody.insertBefore(createFeedRow(idx), totalRow);
  if(idx >= feedRowSeq) feedRowSeq = idx + 1;
  updateFeedGrandTotalCell();
}

function deleteFeedRow(trEl){
  const rows = document.querySelectorAll('#feedTableBody tr.feed-row');
  if(rows.length <= 1){
    alert('至少要保留一列。');
    return;
  }
  trEl.remove();
  updateFeedGrandTotalCell();
  recalcFeedTotals(true);
}

// 把「小計」那個合併儲存格，重新放到目前排在第一列的資料列上，
// rowspan 設成「資料列數 + 1（含合計列）」——每次新增/刪除列都要重算一次。
function updateFeedGrandTotalCell(){
  const old = document.getElementById('feedGrandTotalCell');
  if(old) old.remove();
  const rows = document.querySelectorAll('#feedTableBody tr.feed-row');
  if(rows.length === 0) return;
  const firstRow = rows[0];
  const td = document.createElement('td');
  td.id = 'feedGrandTotalCell';
  td.className = 'feed-grandtotal';
  td.rowSpan = rows.length + 1; // +1 是最下面那列合計
  td.innerHTML = `<span id="feedGrandTotal">0</span>`;
  firstRow.insertBefore(td, firstRow.lastElementChild); // 插在「刪除按鈕」那格之前
  recalcFeedTotals();
}

// autoFill=true（使用者輸入／刪列時）：把餵食表的「小計」自動帶入 5-3「輸入量：液體」欄位；
// 讀取舊紀錄時不帶入，避免蓋掉原本存的值。
function recalcFeedTotals(autoFill){
  let grand = 0;
  FEED_COLS.forEach(c=>{
    let sum = 0;
    document.querySelectorAll(`.feed-${c}`).forEach(inp=>{ sum += Number(inp.value)||0; });
    const cell = document.getElementById(`total_feed_${c}`);
    if(cell) cell.textContent = sum;
    grand += sum;
  });
  const gt = document.getElementById('feedGrandTotal');
  if(gt) gt.textContent = grand;
  // 手機卡片版沒有跨列合併格，改把小計顯示在合計卡片裡（桌機版看不到這個格子的內容）
  const gm = document.getElementById('feedGrandMobile');
  if(gm) gm.dataset.grand = grand;
  if(autoFill){

function serializeForm(){

  form.querySelectorAll('input[type=checkbox]').forEach(chk=>{
    if(!(chk.name in data)) data[chk.name] = 'false';
  });
  return data;
}

function setFieldValue(el, val){
  if(!el) return;
  if(el instanceof RadioNodeList){
    Array.from(el).forEach(r=>{ r.checked = (r.value===val); });
  } else if(el.type === 'checkbox'){
    el.checked = (val === 'true');
  } else {
    el.value = val;
  }
}

/* ---------- 時間欄位（.f-time）自己做 24 小時制格式化 ----------
   邊打邊把輸入內容整理成 HH:MM：
   - 使用者還沒打冒號、純數字連續輸入時（例如快速打「0612」），超過 2 位就自動補冒號 → 06:12
   - 使用者自己打了冒號（例如打「6」再打「:」再打「12」)，就照原樣處理，不會被重新硬塞冒號
   離開欄位（focusout）時，如果格式已經是「數字:數字」，就補零、並把小時/分鐘限制在合法範圍內，
   例如打 6:5 會被整理成 06:05，打 25:99 會被夾住變成 23:59。 */
function formatTimeInputLive(el){
  let v = el.value;
  if(v.includes(':')){
    v = v.replace(/[^\d:]/g,'');
    const idx = v.indexOf(':');
    const hh = v.slice(0, idx).slice(0,2);
    const mm = v.slice(idx+1).replace(/:/g,'').slice(0,2);
    v = hh + ':' + mm;
  } else {
    v = v.replace(/\D/g,'').slice(0,4);
    if(v.length > 2) v = v.slice(0,2) + ':' + v.slice(2);
  }
  el.value = v;
}
function normalizeTimeInputOnBlur(el){
  const v = el.value.trim();
  if(v === '') return;
  const m = v.match(/^(\d{1,2}):(\d{1,2})$/);
  if(!m) return; // 格式還不完整（例如只打了「6:」）就先不動它，避免使用者打到一半被清掉
  const hh = Math.min(23, parseInt(m[1],10) || 0);
  const mm = Math.min(59, parseInt(m[2],10) || 0);
  el.value = String(hh).padStart(2,'0') + ':' + String(mm).padStart(2,'0');
}
document.addEventListener('input', (e)=>{
  if(e.target.classList && e.target.classList.contains('f-time')) formatTimeInputLive(e.target);
});
document.addEventListener('focusout', (e)=>{
  if(e.target.classList && e.target.classList.contains('f-time')) normalizeTimeInputOnBlur(e.target);
});

// 把某一格的資料，整批載入畫面（含 5-3 動態表格要先重建成一樣的列數/編號）
function loadSlotIntoForm(slot){
  form.reset();
  document.getElementById('outputTableBody').innerHTML = '';
  outputRowSeq = 0;
  // 依已存欄位判斷 5-3 表格原本有哪幾列（可能因為使用者刪過列而不連續），
  // 用 addTableRowWithIndex 依原本的 idx 重建，欄位名稱才能對得回去
  const tblIdxs = new Set();
  Object.keys(slot.fields).forEach(k=>{
    const m = k.match(/^c5_53_tbl_(\d+)_/);
    if(m) tblIdxs.add(Number(m[1]));
  });
  if(tblIdxs.size === 0){
    addTableRow();
  } else {
    Array.from(tblIdxs).sort((a,b)=>a-b).forEach(idx=>addTableRowWithIndex(idx));
  }

  // 5-5 餵食紀錄表：清空後只留「合計」那一列，一樣依已存欄位重建資料列
  const feedTbody = document.getElementById('feedTableBody');
  Array.from(feedTbody.querySelectorAll('tr.feed-row')).forEach(tr=>tr.remove());
  feedRowSeq = 0;
  const feedIdxs = new Set();
  Object.keys(slot.fields).forEach(k=>{
    const m = k.match(/^c5_55_tbl_(\d+)_/);
    if(m) feedIdxs.add(Number(m[1]));
  });
  if(feedIdxs.size === 0){
    addFeedRow();
  } else {
    Array.from(feedIdxs).sort((a,b)=>a-b).forEach(idx=>addFeedRowWithIndex(idx));
  }

  Object.entries(slot.fields).forEach(([name,val])=>{
    setFieldValue(form.elements[name], val);
  });
  document.getElementById('recDate').value = slot.date || '';
  document.getElementById('recTime').value = slot.time || '';
  updateDependencies();
  recalcTotals();
  recalcFeedTotals();
}

/* ---------- Firestore 讀寫：每一格資料的文件 ID 用「班別_卡號」當索引鍵 ----------
   用「卡號」而不是「床號」當穩定鍵，是因為病人換床是常有的事、床號可能會變，
   卡號（病歷卡號）才是跟著病人走、不會變的識別碼——這樣之後在「病床資料管理」
   裡改床號，也不會讓已經存好的照護紀錄對不回來。 */

// 把某一格（班別＋病人）的草稿或已存資料寫回 Firestore，失敗時只記錄，不擋住畫面操作
// （本地的 patients[].slots 已經先更新過了，就算這次雲端同步失敗，資料也不會不見）
// 同步原則（避免電腦、手機同時開同一筆時互相蓋掉）：
//  1) 每一格記住「雲端目前的樣子」slot.base；寫入時只送出「跟 base 不一樣」的欄位（合併寫入），
//     不再整份覆蓋——手機改 A 欄、電腦改 B 欄，兩邊都會保留。
//  2) subscribeSlot() 即時監聽目前這一格，別的裝置改了就自動更新到畫面（正在輸入的欄位不動）。
const isDefaultVal = v => v === '' || v === 'false' || v === undefined;
function diffFields(cur, base){
  const out = {};
  Object.keys(cur).forEach(k=>{
    if(cur[k] !== base[k] && !(base[k] === undefined && isDefaultVal(cur[k]))) out[k] = cur[k];
  });
  Object.keys(base).forEach(k=>{ if(!(k in cur)) out[k] = firebase.firestore.FieldValue.delete(); });
  return out;
}

async function saveSlotToCloud(patientIndex, shift, slot, fullOverwrite){
  const p = patients[patientIndex];
  slot.updatedBy = auth.currentUser ? auth.currentUser.email : '';
  slot.updatedAt = new Date().toLocaleString('zh-TW',{hour12:false});
  const cur = Object.assign({}, slot.fields||{});
  const ref = db.collection(RECORDS_COLLECTION).doc(slotDocId(p, shift));
  const meta = {
    company: ORG.company, department: ORG.department, orgId: ORG.id,
    shift, bed: p.info.床號, name: p.info.姓名, gender: p.info.性別,
    chartNo: p.info.病歷號, cardNo: p.info.卡號,
    updatedBy: slot.updatedBy, updatedAt: slot.updatedAt
  };
  try{
    if(fullOverwrite || !slot.base){
      await ref.set(Object.assign(meta,{ date:slot.date||'', time:slot.time||'', saved:!!slot.saved, fields:cur }));
    } else {
      const diff = diffFields(cur, slot.base);
      const bm = slot.baseMeta || {};
      const metaChanged = (slot.date||'')!==bm.date || (slot.time||'')!==bm.time || !!slot.saved!==!!bm.saved;
      if(Object.keys(diff).length===0 && !metaChanged) return; // 沒有任何變更就不寫入，避免用舊畫面蓋掉別人的資料
      const payload = Object.assign(meta,{ date:slot.date||'', time:slot.time||'', saved:!!slot.saved });
      if(Object.keys(diff).length) payload.fields = diff;
      await ref.set(payload, {merge:true});
    }
    slot.base = cur;
    slot.baseMeta = { date:slot.date||'', time:slot.time||'', saved:!!slot.saved };
  }catch(err){
    console.error('寫入 Firestore 失敗：', err);
  }
}

// 5-3 / 5-5 表格各有哪幾列（從欄位名稱 c5_53_tbl_N_xxx 推出列編號）。
// realOnly=true 時只算「有填過數字」的列：空白列沒存進雲端是正常的，不算列數不同。
function rowSet(fields, realOnly){
  const set = new Set();
  Object.keys(fields).forEach(k=>{
    const m = k.match(/^(c5_5[35])_tbl_(\d+)_/);
    if(m && (!realOnly || !isDefaultVal(fields[k]))) set.add(m[1]+'_'+m[2]);
  });
  return set;
}
// 雲端新增了本機沒有的列、或雲端刪掉了本機還有（且有資料）的列，才需要整張表重建
function rowsDiffer(merged, cur, base){
  const mReal = rowSet(merged, true), c = rowSet(cur), bReal = rowSet(base, true), mAll = rowSet(merged);
  for(const r of mReal) if(!c.has(r)) return true;
  for(const r of bReal) if(c.has(r) && !mAll.has(r)) return true;
  return false;
}
let pendingRemote = null;
function subscribeSlot(){
  if(unsubSlot){ unsubSlot(); unsubSlot = null; }
  const p = patients[currentPatientIndex], shift = currentShift;
  if(!p) return;
  unsubSlot = db.collection(RECORDS_COLLECTION).doc(slotDocId(p, shift)).onSnapshot(snap=>{
    if(!snap.exists || snap.metadata.hasPendingWrites) return;
    if(switching || patients[currentPatientIndex] !== p || currentShift !== shift) return;
    applyRemote(snap.data(), p, shift);
  }, err=>console.error('即時監聽失敗：', err));
}
function applyRemote(d, p, shift){
  const slot = p.slots[shift];
  const remote = d.fields || {};
  const cur = serializeForm();
  const base = slot.base || {};
  // 合併：本機「還沒送出的修改」保留，其餘一律採用雲端最新值
  const merged = Object.assign({}, remote);
  new Set([...Object.keys(cur), ...Object.keys(base)]).forEach(k=>{
    if(cur[k] !== base[k] && !(base[k] === undefined && isDefaultVal(cur[k]))){
      if(k in cur) merged[k] = cur[k]; else delete merged[k];
    }
  });
  const ae = document.activeElement;
  const editing = !!(ae && (form.contains(ae) || ae.id==='recDate' || ae.id==='recTime'));
  const sameStruct = !rowsDiffer(merged, cur, base);
  if(sameStruct){
    Object.keys(merged).forEach(k=>{
      const el = form.elements[k];
      if(!el || el === ae || (el.length && el.contains && el.contains(ae))) return;
      if(cur[k] !== merged[k]) setFieldValue(el, merged[k]);
    });
    const bm = slot.baseMeta || {};
    ['recDate','recTime'].forEach(id=>{
      const el = document.getElementById(id), key = id==='recDate'?'date':'time';
      if(el !== ae && el.value === (bm[key]||'') && el.value !== (d[key]||'')) el.value = d[key]||'';
    });
    updateDependencies(); recalcTotals(); recalcFeedTotals();
  } else if(!editing){
    const ns = Object.assign({}, slot, { fields: merged, date: d.date||'', time: d.time||'' });
    loadSlotIntoForm(ns);
  } else {
    pendingRemote = {d, p, shift}; // 正在輸入且列數不同：等離開欄位後再套用
    return;
  }
  slot.base = Object.assign({}, remote);
  slot.baseMeta = { date:d.date||'', time:d.time||'', saved:!!d.saved };
  slot.saved = !!d.saved;
  slot.updatedBy = d.updatedBy||''; slot.updatedAt = d.updatedAt||'';
  renderSlotStatus();
}
// 新增／刪除表格列時瀏覽器不會觸發 input 事件，這裡補一個，讓列數變動也會自動同步到雲端

// 讀取某一格（班別＋病人）在雲端的最新資料；讀不到（尚未有人存過或離線）就退回本地快取
async function loadSlotFromCloud(patientIndex, shift){
  const p = patients[patientIndex];
  try{
    const snap = await db.collection(RECORDS_COLLECTION).doc(slotDocId(p, shift)).get();
    if(snap.exists){
      const d = snap.data();
      const slot = {
        fields: d.fields||{}, date: d.date||'', time: d.time||'',
        saved: !!d.saved, savedAt: '', updatedBy: d.updatedBy||'', updatedAt: d.updatedAt||'',
        base: Object.assign({}, d.fields||{}), baseMeta: { date:d.date||'', time:d.time||'', saved:!!d.saved }
      };
      p.slots[shift] = slot;
      return slot;
    }
  }catch(err){
    console.error('讀取 Firestore 失敗，改用本地快取：', err);
  }
  return p.slots[shift];
}

/* ---------- XML 匯出 / 匯入 ---------- */
function buildXmlDoc(){
  const doc = document.implementation.createDocument('', 'A13照護資料', null);
  const root = doc.documentElement;
  root.setAttribute('公司', ORG.company);
  root.setAttribute('部門', ORG.department);
  patients.forEach(p=>{
    // 每一床、每一班別都各輸出一筆 <紀錄>，固定就是 31 床 x 3 班別 = 93 筆，
    // 且每一筆都直接把「班別、床號、姓名、性別」寫在自己身上當索引鍵，
    // 不管之後這份 XML 被匯入、被排序、被丟進 Excel/試算表，都能靠這幾欄還原對應關係，不會跳位。
    SHIFTS.forEach(shift=>{
      const slot = p.slots[shift];
      const rEl = doc.createElement('紀錄');
      rEl.setAttribute('公司', ORG.company);
      rEl.setAttribute('部門', ORG.department);
      rEl.setAttribute('班別', shift);
      rEl.setAttribute('床號', p.info.床號||'');
      rEl.setAttribute('姓名', p.info.姓名||'');
      rEl.setAttribute('性別', p.info.性別||'');
      rEl.setAttribute('病歷號', p.info.病歷號||'');
      rEl.setAttribute('卡號', p.info.卡號||'');
      rEl.setAttribute('日期', slot.date||'');
      rEl.setAttribute('時間', slot.time||'');
      rEl.setAttribute('已存檔', slot.saved ? 'true':'false');
      rEl.setAttribute('最後更新人員', slot.updatedBy||'');
      rEl.setAttribute('最後更新時間', slot.updatedAt||'');
      Object.entries(slot.fields).forEach(([k,v])=>{
        const fEl = doc.createElement('欄位');
        fEl.setAttribute('名稱', k);
        fEl.textContent = v==null?'':String(v);
        rEl.appendChild(fEl);
      });
      root.appendChild(rEl);
    });
  });
  return doc;
}

// 簡易 XML 縮排排版，方便打開檔案時人眼閱讀
function formatXml(xml){
  let formatted = '';
  let indent = '';
  xml.split(/>\s*</).forEach(node=>{
    if(node.match(/^\/\w/)) indent = indent.substring(2);
    formatted += indent + '<' + node + '>\n';
    if(node.match(/^<?\w[^>]*[^/]$/) && !node.startsWith('?')) indent += '  ';
  });
  return formatted.substring(1, formatted.length-2);
}

function todayStr(){
  const d = new Date();
  return d.toISOString().slice(0,10).replace(/-/g,'');
}

function exportXml(){
  const doc = buildXmlDoc();
  let xmlStr = new XMLSerializer().serializeToString(doc);
  xmlStr = formatXml(xmlStr);
  const blob = new Blob(['<?xml version="1.0" encoding="UTF-8"?>\n'+xmlStr], {type:'application/xml'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `A13照護資料_${todayStr()}.xml`;
  document.body.appendChild(a);
  a.click();
  a.remove();
}

function handleImportFile(e){
  const file = e.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = ()=> importXml(reader.result);
  reader.readAsText(file, 'UTF-8');
  e.target.value = '';
}

async function importXml(text){
  const parser = new DOMParser();
  const doc = parser.parseFromString(text, 'application/xml');
  if(doc.querySelector('parsererror')){ alert('匯入失敗：XML 格式錯誤。'); return; }

  document.getElementById('statusLeft').textContent = '匯入中，同步寫回雲端...';
  const writes = [];

  // 扁平化格式：每一筆 <紀錄> 自己就帶著 班別／床號／卡號／姓名／性別 當索引鍵，
  // 優先用「卡號」比對回對應的病人（卡號比較穩定，床號可能因為換床而改變），
  // 找不到卡號才退而用床號、病歷號比對，直接寫回該病人、該班別自己的那一格，不會有跳位問題。
  // 匯入的同時也順便寫回 Firestore，這樣「匯入 XML」也能當作是「從備份還原雲端資料」的功能。
  doc.querySelectorAll('紀錄').forEach(rEl=>{
    const cardNo = rEl.getAttribute('卡號');
    const bedNo = rEl.getAttribute('床號');
    const chartNo = rEl.getAttribute('病歷號');
    const shift = rEl.getAttribute('班別') || '白班';
    let patientIndex = cardNo ? patients.findIndex(p=>p.info.卡號 === cardNo) : -1;
    if(patientIndex < 0) patientIndex = patients.findIndex(p=>p.info.床號 === bedNo);
    if(patientIndex < 0 && chartNo) patientIndex = patients.findIndex(p=>p.info.病歷號 === chartNo);
    const patient = patientIndex >= 0 ? patients[patientIndex] : null;
    if(!patient) return; // 目前病床清單裡找不到對應病人，略過這筆，不憑空捏造病人

    const fields = {};
    rEl.querySelectorAll('欄位').forEach(fEl=>{
      fields[fEl.getAttribute('名稱')] = fEl.textContent;
    });
    const slot = {
      fields,
      date: rEl.getAttribute('日期') || '',
      time: rEl.getAttribute('時間') || '',
      saved: rEl.getAttribute('已存檔') === 'true',
      savedAt: '',
      updatedBy: rEl.getAttribute('最後更新人員') || '',
      updatedAt: rEl.getAttribute('最後更新時間') || ''
    };
    patient.slots[shift] = slot;
    writes.push(saveSlotToCloud(patients.indexOf(patient), shift, slot, true));
  });

  await Promise.all(writes);
  loadSlotIntoForm(getCurrentSlot());
  renderShiftTabs();
  renderPatientList();
  renderPatientBar();
  renderSlotStatus();
  updateStatusRight();
  document.getElementById('statusLeft').textContent = '就緒（匯入完成，已同步雲端）';
  alert('匯入完成，並已同步寫回雲端！');
}

function hEls(){ return Array.from(hPanel().querySelectorAll('input[name], textarea[name]')); }
function hCollect(){
  const out = {};
  hEls().forEach(el=>{
    if(el.type==='radio'){ if(!(el.name in out)) out[el.name] = ''; if(el.checked) out[el.name] = el.value; }
    else if(el.type==='checkbox') out[el.name] = el.checked ? 'true' : 'false';
    else out[el.name] = el.value;
  });

}
function hSet(fields, skipEl){
  hEls().forEach(el=>{
    if(el === skipEl) return;
    const v = fields[el.name];
    if(el.type==='radio') el.checked = (v !== undefined && v === el.value);
    else if(el.type==='checkbox') el.checked = (v === 'true');
    else el.value = (v === undefined ? '' : v);
  });
  hUpdateUI();
}

/* ============================================================
   交班注意事項：翻譯（英語／印尼語／越南語／泰語）＋ 語音發音 ＋ MP3 下載
   - 固定欄位（翻身、約束、隔離、飲食…）用內建詞庫，不需要網路、不會翻錯。
   - 自由輸入的文字（其他注意事項、其他隔離說明）用線上機器翻譯（Google 免費翻譯，失敗改用 MyMemory）；
     翻不出來就顯示原文並註明「未翻譯」。

     檔名：年月日_病床號.mp3，例如 20261112_01床.mp3。

   ============================================================ */

let hLang = 'zh', hTransToken = 0, hTransSpoken = [];
const hTransCache = new Map();

async function hTranslateText(text, lang){
  const key = lang + '|' + text;
  if(hTransCache.has(key)) return hTransCache.get(key);
  let out = null;
  try{ // 1) Google 免費翻譯
    const r = await fetch('https://translate.googleapis.com/translate_a/single?client=gtx&sl=zh-TW&tl=' + lang + '&dt=t&q=' + encodeURIComponent(text));
    const j = await r.json();
    out = j[0].map(x=>x[0]).join('');
  }catch(_){}
  if(!out){
    try{ // 2) MyMemory
      const r = await fetch('https://api.mymemory.translated.net/get?langpair=zh-TW|' + lang + '&q=' + encodeURIComponent(text));
      const j = await r.json();
      if(j.responseData && j.responseData.translatedText) out = j.responseData.translatedText;
    }catch(_){}
  }
  if(out) hTransCache.set(key, out);
  return out;
}

// 依目前填寫的資料，組出該語言要顯示／朗讀的項目（只含有填的項目）
async function hBuildTranslation(lang){
  const f = hCollect(), D = H_DICT[lang], items = [];
  const free = async t=>{ t = (t||'').trim(); if(!t) return null; const tr = await hTranslateText(t, lang); return { tr: tr || null, orig: t }; };
  const aItems = [];
  if(f.h_turn === 'normal') aItems.push({ t: D.turnNormal });
  if(f.h_turn === 'ban'){
    aItems.push({ t: D.turnBan });
    ['left','lying','right'].filter(k=>f['h_ban_'+k]==='true').forEach(k=>aItems.push({ t: '　• ' + D.ban[k] }));
  }
  if(f.h_wrist) aItems.push({ t: D.wrist + ' ' + D.wristV[f.h_wrist] + '.' });
  if(f.h_foot) aItems.push({ t: D.foot + ' ' + D.footV[f.h_foot] + '.' });
  const iso = ['sputum','blood','urine','scabies'].filter(k=>f['h_iso_'+k]==='true').map(k=>D.isoV[k]);
  let otherIso = null;
  if(f.h_iso_other === 'true'){
    otherIso = await free(f.h_iso_other_text);
    iso.push(D.isoV.other + (otherIso ? ' (' + (otherIso.tr || otherIso.orig) + ')' : ''));
  }
  if(f.h_iso_none === 'true') iso.push(D.isoV.none);
  if(iso.length) aItems.push({ t: D.iso + ' ' + iso.join(', ') + '.', orig: otherIso && otherIso.orig, bad: !!(otherIso && !otherIso.tr) });
  const aNote = await free(f.h_a_note);
  if(aNote) aItems.push({ t: D.note + ' ' + (aNote.tr || aNote.orig), orig: aNote.orig, bad: !aNote.tr });
  if(aItems.length) items.push({ h: D.zoneA }, ...aItems);
  const bItems = [];
  if(f.h_milk === 'yes'){
    bItems.push({ t: D.milkYes });
    if(f.h_kcal) bItems.push({ t: '　• ' + D.kcal(f.h_kcal) });
    if(f.h_protein_pct || f.h_protein_g) bItems.push({ t: '　• ' + D.prot(f.h_protein_pct, f.h_protein_g) });
    if(f.h_dm === 'true') bItems.push({ t: '　• ' + D.dm });
  } else if(f.h_milk === 'no') bItems.push({ t: D.milkNo });
  const bNote = await free(f.h_b_note);
  if(bNote) bItems.push({ t: D.note + ' ' + (bNote.tr || bNote.orig), orig: bNote.orig, bad: !bNote.tr });
  if(bItems.length) items.push({ h: D.zoneB }, ...bItems);
  if(!items.length) items.push({ t: D.empty });
  return items;
}

function hEsc(t){ return String(t).replace(/[&<>]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])); }
async function hRenderLang(){
  const zh = hLang === 'zh';
  document.getElementById('hEditor').style.display = zh ? '' : 'none';
  document.getElementById('hTrans').style.display = zh ? 'none' : '';
  document.querySelectorAll('#hLangBar button').forEach(b=>b.classList.toggle('active', b.dataset.lang === hLang));
  hStopSpeech();
  if(zh) return;
  const my = ++hTransToken, body = document.getElementById('hTransBody'), st = document.getElementById('hTransStatus');
  body.innerHTML = '翻譯中…'; st.textContent = '';
  const items = await hBuildTranslation(hLang);
  if(my !== hTransToken) return; // 期間又切換了語言
  const D = H_DICT[hLang], p = hPatient;
  const dt = new Date(), ymd = `${dt.getFullYear()}/${String(dt.getMonth()+1).padStart(2,'0')}/${String(dt.getDate()).padStart(2,'0')}`; // 西元年月日
  const head = p ? `<div style="font-size:16px;margin-bottom:6px;">${ymd}　${D.bed}：${hEsc(p.info.卡號)}</div>` : '';
  let anyBad = false;
  body.innerHTML = head + items.map(i=>{
    if(i.h) return `<h4>${hEsc(i.h)}</h4>`;
    if(i.bad) anyBad = true;
    return `<div>${hEsc(i.t)}${i.bad ? ' <span class="orig">' + D.untranslated + '</span>' : ''}${i.orig && !i.bad ? '<div class="orig">原文：' + hEsc(i.orig) + '</div>' : ''}</div>`;
  }).join('');
  st.style.color = '#c00';
  st.textContent = anyBad ? '部分自由輸入文字無法連線翻譯，已顯示原文。' : '';
  // 朗讀稿：卡號 + 各項目（不含姓名、年齡等基本資料）
  const card = p && (p.info.卡號||'').trim();
  hTransSpoken = [];
  if(card) hTransSpoken.push(`${D.bed} ${card.split('').join(' ')}.`); // 卡號逐字唸出
  items.forEach(i=>{ const t = i.h || i.t; if(t) hTransSpoken.push(t.replace(/^[\s　•]+/, '').trim()); });
}

function hStopSpeech(){ try{ speechSynthesis.cancel(); }catch(_){} }
function hSpeak(){
  const st = document.getElementById('hTransStatus'); st.style.color = '#c00';
  if(!('speechSynthesis' in window)){ st.textContent = '此裝置不支援語音朗讀。'; return; }
  hStopSpeech();
  const L = H_LANGS[hLang]; if(!L || !hTransSpoken.length) return;
  const voices = speechSynthesis.getVoices() || [];
  const v = voices.find(x=>x.lang && x.lang.toLowerCase().replace('_','-') === L.tts.toLowerCase()) || voices.find(x=>x.lang && x.lang.toLowerCase().startsWith(hLang));
  st.textContent = v ? '' : '此裝置沒有找到「' + L.name + '」語音，可能無法發音（請到系統設定安裝該語言的文字轉語音）。';
  hTransSpoken.forEach(t=>{
    const u = new SpeechSynthesisUtterance(t); u.lang = L.tts; if(v) u.voice = v; u.rate = 0.95;
    speechSynthesis.speak(u);
  });
}
function hFileName(){
  const d = new Date(), y = d.getFullYear(), m = String(d.getMonth()+1).padStart(2,'0'), dd = String(d.getDate()).padStart(2,'0');
  const bed = (hPatient && hPatient.info.卡號 || '').replace(/[\\/:*?"<>|\s]/g,'');
  return `${y}${m}${dd}_${bed}.mp3`;
}
async function hDownloadMp3(){
  const st = document.getElementById('hTransStatus');
  if(!hTransSpoken.length){ st.style.color = '#c00'; st.textContent = '沒有可轉成語音的內容。'; return; }
  let key = '';
  try{ key = localStorage.getItem('a13_voicerss_key') || ''; }catch(_){}
  if(!key){
    key = (prompt('下載 MP3 需要 VoiceRSS 免費語音金鑰（不需信用卡，每天 350 次）。\n到 https://www.voicerss.org/registration.aspx 註冊後，把 API Key 貼在這裡：') || '').trim();
    if(!key) return;
    try{ localStorage.setItem('a13_voicerss_key', key); }catch(_){}
  }
  st.style.color = '#2f7f7d'; st.textContent = '產生 MP3 中…';
  try{
    const body = new URLSearchParams({ key, hl: H_LANGS[hLang].rss, c:'MP3', f:'44khz_16bit_mono', src: hTransSpoken.join('\n') });
    const r = await fetch('https://api.voicerss.org/', { method:'POST', headers:{'Content-Type':'application/x-www-form-urlencoded'}, body });
    const blob = await r.blob();
    if(!/audio|mpeg|octet/i.test(blob.type)){ // VoiceRSS 出錯時回傳純文字 ERROR: ...
      const msg = await blob.text();
      if(/key/i.test(msg)){ try{ localStorage.removeItem('a13_voicerss_key'); }catch(_){} }
      throw new Error(msg.slice(0, 120));
    }
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = hFileName();
    document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(a.href), 2000);
    st.textContent = '已下載 ' + hFileName();
  }catch(err){
    st.style.color = '#c00'; st.textContent = 'MP3 產生失敗：' + (err.message || err) + '（可先用「發音」播放）';
  }
}
(function(){ // 事件放在 document 上（按鈕是 buildStaticUI 之後才產生）
  document.addEventListener('click', e=>{
    const b = e.target.closest('#hLangBar button[data-lang]');
    if(b){ hLang = b.dataset.lang; hRenderLang(); return; }
    if(e.target.closest('#hSpeak')) hSpeak();
    else if(e.target.closest('#hStop')) hStopSpeech();
    else if(e.target.closest('#hMp3')) hDownloadMp3();
  });
})();

/* ---------- 建立捷徑（Android / iPhone / 桌機）----------
   比喻：把「A13」這家店的門牌放到你家門口（主畫面／桌面），一點就進，不用每次打網址。
   - Android Chrome、桌機 Chrome/Edge：瀏覽器若允許，一鍵「安裝」；
   - iPhone Safari：蘋果不開放程式安裝，只能教使用者「分享 → 加入主畫面」；
   - 桌機另外提供下載「.url 捷徑檔」（Windows 雙擊就開網頁）。 */
(function(){
  const SITE_URL = 'https://achir1015.github.io/A13input/';
  const pageUrl = /^https?:/.test(location.protocol) ? (location.origin + location.pathname) : SITE_URL;
  const ua = navigator.userAgent || '';
  const isIOS = /iPhone|iPad|iPod/.test(ua) || (navigator.platform==='MacIntel' && navigator.maxTouchPoints>1);
  const isAndroid = /Android/.test(ua);
  const standalone = (window.matchMedia && matchMedia('(display-mode: standalone)').matches) || navigator.standalone === true || !!window.Capacitor;
  let deferred = null;
  const btn = document.getElementById('btnShortcut');
  if(standalone && btn) btn.style.display = 'none'; // 已經是從捷徑/App 開啟，就不用再顯示
  window.addEventListener('beforeinstallprompt', e=>{ e.preventDefault(); deferred = e; });
  window.addEventListener('appinstalled', ()=>{ deferred = null; if(btn) btn.style.display='none'; });
  if('serviceWorker' in navigator && /^https?:/.test(location.protocol)){
    navigator.serviceWorker.register('sw.js').catch(()=>{});
  }
  const modal = document.getElementById('shortcutModal'), body = document.getElementById('shortcutBody');
  const close = ()=>{ modal.style.display='none'; };
  document.getElementById('shortcutClose').addEventListener('click', close);
  modal.addEventListener('click', e=>{ if(e.target===modal) close(); });
  function downloadUrlFile(){
    const blob = new Blob(['[InternetShortcut]\r\nURL=' + pageUrl + '\r\n'], {type:'application/octet-stream'});
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'A13照護.url';
    document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(a.href), 1000);
  }
  function show(html){ body.innerHTML = html; modal.style.display = 'flex'; const d = document.getElementById('dlUrlBtn'); if(d) d.onclick = downloadUrlFile; }
  btn && btn.addEventListener('click', async ()=>{
    if(deferred){ // 瀏覽器支援一鍵安裝
      deferred.prompt();
      try{ await deferred.userChoice; }catch(_){}
      deferred = null; return;
    }
    if(isIOS){
      show(`<b>iPhone / iPad（請用 Safari 開啟）</b><ol style="padding-left:22px;margin:6px 0">
        <li>點畫面下方的 <b>分享</b> 圖示（方框加向上箭頭）</li>
        <li>往下滑，選 <b>加入主畫面</b></li>
        <li>按右上角 <b>新增</b>，主畫面就會出現 A13 圖示</li></ol>
        <div style="color:#888;font-size:14px">若用 Chrome 開啟，請先改用 Safari。</div>`);
    } else if(isAndroid){
      show(`<b>Android（Chrome）</b><ol style="padding-left:22px;margin:6px 0">
        <li>點右上角 <b>⋮</b> 選單</li>
        <li>選 <b>加到主畫面</b>（或 <b>安裝應用程式</b>）</li>
        <li>按 <b>新增／安裝</b>，主畫面就會出現 A13 圖示</li></ol>
        <div style="color:#888;font-size:14px">Samsung Internet：選單 ≡ → 新增頁面至 → 主畫面。</div>`);
    } else {
      show(`<b>電腦</b><ol style="padding-left:22px;margin:6px 0">
        <li><b>Chrome / Edge</b>：網址列右側的 <b>安裝</b> 圖示，或選單 ⋮ → <b>投放、儲存與分享 → 安裝頁面為應用程式</b>，會在桌面／開始功能表建立獨立視窗捷徑。</li>
        <li><b>Windows 桌面捷徑檔</b>：<button id="dlUrlBtn" style="padding:4px 10px;font-size:16px;">下載 A13照護.url</button>，下載後放到桌面，雙擊即開啟網頁。</li>
        <li><b>Mac Safari</b>：選單 檔案 → 加入 Dock。</li></ol>`);
    }
  });
})();
</script>
</body>
</html>
